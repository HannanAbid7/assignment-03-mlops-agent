[project]
name = "mlops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dvc", "mlflow", "scikit-learn", "pandas",
    "fastapi", "uvicorn", "kubernetes", "requests",
    "pydantic", "openai", "python-dotenv",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff"]

[tool.setuptools]
packages = ["agent", "agent.tools"]

[tool.pytest.ini_options]
pythonpath = ["."]